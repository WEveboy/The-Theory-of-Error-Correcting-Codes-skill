schema_version: 1
bundle_id: bundle.boolean-vector-research
book:
  title: 布尔函数与向量值函数科研工具（MacWilliams基础与独立扩展）
  author: MacWilliams & Sloane；扩展来源另标
  source_pack: boolean-vector-cangjie
  baseline_tag: research-0.2.2
entry:
  name: boolean-vector-research
  description: 布尔函数与向量值函数科研：Walsh/RM、bent/APN、有限域迹构造、DDT/BCT/DLCT、AI、函数生成码、EA/CCZ给定证书、设计与序列，以及带哈希的可复算实验。用于设计和分析有限候选及核对证明条件；不替代完整分类、通用译码或系统安全评估。
  core_principles:
  - 先读resources/usage.md确认当前命令与限制；所有计算记录n,m、位序、域模型和预算。
  - 分离B原书、D独立推导、E外部理论、H研究假设；证明、有限全算、采样和未定分别报告。
  - 向量性质检查全部非零分量；函数与码的距离关系先过满秩门；bent、平衡和置换的条件分别核对。
  - 执行前读取能力卡；跨域任务按阶段依次加载所需卡，每阶段最多两张，逐项输出证书与失败见证。
  - 扩展研究优先查resources/research_map.md；完整CCZ分类、一般高阶精确距离、LP界和新族证明不得伪报已完成。
  - 使用Python3.10+标准库工具；资源相对SKILL目录定位。结果写用户工作目录，不写已安装技能目录。
  out_of_scope:
  - 通用BCH/RS译码工程、任意PDF自动蒸馏和与函数科研无关的请求。
  - 自动证明新颖性、无条件宣称安全或实现完整CCZ分类。
  stop_conditions:
  - 缺n/m/位序/域模型时询问或明确仅用已有真值表，不能猜关键条件。
  - 超预算、来源不足或定理前提不满足时说明未算/未证；继续可执行的独立部分。
  - 禁止将p.430习题20印刷推广式当有效构造；使用卡内有证明的同侧变量版本。
