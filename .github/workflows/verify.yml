name: First edition verification
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s skills/boolean-vector-research/resources -p "test_*.py"
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/make_release.py --prepare-only
      - run: node --test tests/test_deepseek.mjs
      - run: python scripts/verify_project.py
  publish:
    needs: test
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: first edition')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/make_release.py
      - run: python scripts/smoke_release.py --out build/ci-archive-smoke
      - run: python scripts/publish_release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
